<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HisabKitab - Hostel Expense Splitter</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }
    body {
      margin: 0;
      background: #0f172a;
      color: #e2e8f0;
      padding: 20px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
    }
    h1 {
      margin: 0 0 6px 0;
      font-size: 28px;
      color: #f8fafc;
    }
    .subtitle {
      color: #94a3b8;
      margin-bottom: 20px;
      font-size: 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 800px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 18px;
    }
    h2 {
      margin-top: 0;
      font-size: 18px;
      margin-bottom: 14px;
      color: #f1f5f9;
    }
    label {
      display: block;
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 5px;
      margin-top: 10px;
    }
    input, select {
      width: 100%;
      padding: 9px 10px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-size: 14px;
    }
    .row {
      display: flex;
      gap: 10px;
    }
    .row > div {
      flex: 1;
    }
    button {
      margin-top: 12px;
      padding: 10px 14px;
      border: none;
      border-radius: 6px;
      background: #10b981;
      color: #06281e;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background: #34d399;
    }
    button.secondary {
      background: #334155;
      color: #f8fafc;
    }
    button.secondary:hover {
      background: #475569;
    }
    button.danger {
      background: #ef4444;
      color: #fff;
      padding: 5px 9px;
      font-size: 12px;
      margin-top: 0;
    }
    .member-list, .expense-list, .settlement-list, .standing-list {
      margin-top: 12px;
    }
    .item-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 7px;
      padding: 10px 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .small {
      font-size: 12px;
      color: #94a3b8;
    }
    .pos {
      color: #34d399;
      font-weight: bold;
    }
    .neg {
      color: #f87171;
      font-weight: bold;
    }
    .zero {
      color: #94a3b8;
    }
    .participants-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px 10px;
      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .participants-box label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin: 0;
      cursor: pointer;
      font-size: 13px;
    }
    .participants-box input[type="checkbox"] {
      width: auto;
    }
    .pay-link {
      display: inline-block;
      margin-top: 6px;
      padding: 6px 10px;
      background: #059669;
      color: #fff;
      text-decoration: none;
      border-radius: 5px;
      font-size: 12px;
      font-weight: bold;
    }
    .total-bar {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>HisabKitab</h1>
    <div class="subtitle">Hostel Expense Splitter &amp; Debt Settlement</div>

    <div class="grid">
      <div>
        <div class="card">
          <h2>1. Roommates &amp; UPI</h2>
          <div class="row">
            <div>
              <label for="memberName">Name</label>
              <input id="memberName" type="text" placeholder="e.g. Aarav" />
            </div>
            <div>
              <label for="memberUpi">UPI ID</label>
              <input id="memberUpi" type="text" placeholder="e.g. aarav@okicici" />
            </div>
          </div>
          <button onclick="handleAddMember()">+ Add Member</button>
          <button class="secondary" onclick="loadSampleRoommates()">Load Default Roommates</button>

          <div id="memberList" class="member-list"></div>
        </div>

        <div class="card">
          <h2>2. Add Expense</h2>
          <label for="expenseTitle">Title</label>
          <input id="expenseTitle" type="text" placeholder="e.g. Zomato / Electricity Bill" />

          <div class="row">
            <div>
              <label for="expenseAmount">Amount (₹)</label>
              <input id="expenseAmount" type="number" min="1" step="0.01" placeholder="12000" />
            </div>
            <div>
              <label for="paidBySelect">Paid By</label>
              <select id="paidBySelect"></select>
            </div>
          </div>

          <label>Split Equally Among</label>
          <div id="participantsBox" class="participants-box"></div>

          <button onclick="handleAddExpense()">Save Expense &amp; Settle</button>
          <button class="secondary" onclick="clearAllData()">Reset All</button>

          <div class="total-bar">
            <span>Total Expenses</span>
            <span id="totalExpenseText">₹0</span>
          </div>
          <div id="expenseList" class="expense-list"></div>
        </div>
      </div>

      <div>
        <div class="card">
          <h2>3. Minimum Transactions</h2>
          <div id="settlementList" class="settlement-list"></div>
        </div>

        <div class="card">
          <h2>4. Net Balance</h2>
          <div id="standingList" class="standing-list"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_MEMBERS = "hk_members_v1";
    const STORAGE_BILLS = "hk_bills_v1";

    let members = JSON.parse(localStorage.getItem(STORAGE_MEMBERS) || "null");
    let bills = JSON.parse(localStorage.getItem(STORAGE_BILLS) || "null");

    if (!Array.isArray(members)) {
      members = [
        { id: "m1", name: "Aarav", upi: "aarav.hostel@okicici" },
        { id: "m2", name: "Rohan", upi: "rohan99@ybl" },
        { id: "m3", name: "Kabir", upi: "kabir.dev@okaxis" },
        { id: "m4", name: "Dev", upi: "devansh@paytm" }
      ];
    }

    if (!Array.isArray(bills)) {
      bills = [];
    }

    function saveData() {
      localStorage.setItem(STORAGE_MEMBERS, JSON.stringify(members));
      localStorage.setItem(STORAGE_BILLS, JSON.stringify(bills));
    }

    function loadSampleRoommates() {
      members = [
        { id: "m1", name: "Aarav", upi: "aarav.
